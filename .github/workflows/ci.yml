name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if nc -z localhost 1433; then
              echo "SQL Server is ready"
              break
            fi
            echo "Waiting for SQL Server..."
            sleep 2
          done

      - name: Restore dependencies
        run: dotnet restore Week9/Day3/TaskProjectManagement.sln

      - name: Build
        run: dotnet build Week9/Day3/TaskProjectManagement.sln --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 9.0.8

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Update test database
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          TEST_DB_CONNECTION: "Server=localhost,1433;Database=TaskProjectManagementTestDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
        run: >
          dotnet ef database update
          --project Week9/Day3/TaskProjectManagement.Api
          --startup-project Week9/Day3/TaskProjectManagement.Api
          --connection "$TEST_DB_CONNECTION"

      - name: Test
        env:
          TEST_DB_CONNECTION: "Server=localhost,1433;Database=TaskProjectManagementTestDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
        run: dotnet test Week9/Day3/TaskProjectManagement.sln --no-build